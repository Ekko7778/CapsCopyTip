# CursorTip 语法守门：CursorTip.ahk 变更时跑 Ahk2Exe 全脚本编译检查
# 项目无测试 / 无 Linter，「能编译」就是唯一的自动验证手段（对应本地 CLAUDE.md 的 Ahk2Exe /silent 检查）
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'CursorTip.ahk'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'CursorTip.ahk'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 AutoHotkey v2（choco）并递归定位 Ahk2Exe
        shell: pwsh
        run: |
          choco install autohotkey -y --no-progress
          $roots = @('C:\Program Files\AutoHotkey', 'C:\Program Files (x86)\AutoHotkey', "$env:LocalAppData\Programs\AutoHotkey")
          $ahk2exe = Get-ChildItem -Path $roots -Recurse -Filter 'Ahk2Exe.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          $base = Get-ChildItem -Path $roots -Recurse -Filter 'AutoHotkey64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          "ahk2exe: $ahk2exe"
          "base: $base"
          if (-not $ahk2exe -or -not $base) { Write-Error '::error::未找到 Ahk2Exe.exe / AutoHotkey64.exe'; exit 1 }
          "AHK2EXE=$ahk2exe" >> $env:GITHUB_ENV
          "AHKBASE=$base" >> $env:GITHUB_ENV

      - name: Ahk2Exe 全脚本语法编译检查
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP '_check.exe'
          $p = Start-Process -FilePath $env:AHK2EXE -ArgumentList '/silent', '/in', 'CursorTip.ahk', '/out', $out, '/base', $env:AHKBASE -Wait -PassThru
          "Ahk2Exe exit: $($p.ExitCode)"
          if (-not (Test-Path $out)) {
            Write-Error '::error::未产出 exe —— CursorTip.ahk 存在语法错误'
            exit 1
          }
          "语法编译检查通过"
          Remove-Item $out -Force
