# CursorTip 语法守门：CursorTip.ahk 变更时跑 Ahk2Exe 全脚本编译检查
# 项目无测试 / 无 Linter，「能编译」就是唯一的自动验证手段（对应本地 CLAUDE.md 的 Ahk2Exe /silent 检查）
name: CI

on:
  push:
    branches: [main]
    paths:
      - 'CursorTip.ahk'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'CursorTip.ahk'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 AutoHotkey v2（choco，含 Compiler\Ahk2Exe.exe）
        shell: pwsh
        run: |
          choco install autohotkey -y --no-progress
          $ahk2exe = 'C:\Program Files\AutoHotkey\v2\Compiler\Ahk2Exe.exe'
          $base = 'C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe'
          if (-not (Test-Path $ahk2exe) -or -not (Test-Path $base)) {
            Write-Error '::error::choco 安装后未找到 Ahk2Exe / AutoHotkey64'
            exit 1
          }
          "AHK v2 就绪: $ahk2exe"

      - name: Ahk2Exe 全脚本语法编译检查
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP '_check.exe'
          $p = Start-Process -FilePath 'C:\Program Files\AutoHotkey\v2\Compiler\Ahk2Exe.exe' -ArgumentList '/silent', '/in', 'CursorTip.ahk', '/out', $out, '/base', 'C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe' -Wait -PassThru
          "Ahk2Exe exit: $($p.ExitCode)"
          if (-not (Test-Path $out)) {
            Write-Error '::error::未产出 exe —— CursorTip.ahk 存在语法错误'
            exit 1
          }
          "语法编译检查通过"
          Remove-Item $out -Force
