# CursorTip 发行构建：手动触发（Actions 页面 Run workflow），CI 编译并创建 GitHub Release
# 流程：bump VERSION → push main → Actions → Release → Run workflow
#   tag = vX.Y.Z 由 CursorTip.ahk 的 VERSION 行推导（单一真源），--target 钉死在本次构建的 SHA，
#   不存在 tag/版本号错位的可能
# 注意：不监听 push（tag 或 main）——发行必须是显式的人工动作；tag 已存在时 gh 会报错，
#   想重发同版本需先删 Release + tag
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 读取脚本版本号（单一真源：CursorTip.ahk 的 VERSION 行）
        shell: pwsh
        run: |
          $m = Select-String -Path 'CursorTip.ahk' -Pattern 'global VERSION := "(\d+\.\d+\.\d+)"'
          if (-not $m) {
            Write-Error '::error::CursorTip.ahk 里找不到 VERSION 行'
            exit 1
          }
          $ver = $m.Matches[0].Groups[1].Value
          "VERSION=$ver" >> $env:GITHUB_ENV
          "脚本版本号: $ver"

      # AHK v2 zip 只含运行时（AutoHotkey64.exe）；Ahk2Exe 在 AutoHotkey/Ahk2Exe 仓库单独发行
      # （v2 安装器/zip 均不附带，靠 UX\install-ahk2exe.ahk 按需下载——在无桌面 CI 上不可用）。
      # 必须用 release 资产里的**编译版** Ahk2Exe.zip（单文件 Ahk2Exe.exe）；
      # tag 源码 zipball 不可用：只有 ~54KB 且为 v1.1 源码，v2 解释器无法运行。
      # 双 zip 直解到同一目录 = 社区通用 CI 配方，绕开一切安装器（官方/UX/choco 安装器均会挂起或装不上）。
      - name: 下载 AutoHotkey v2 + Ahk2Exe（zip 直解，不走安装器）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ahk'
          $ahkZip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          $cplZip = Join-Path $env:RUNNER_TEMP 'ahk2exe.zip'
          curl.exe -sL 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.27/AutoHotkey_2.0.27.zip' -o $ahkZip
          curl.exe -sL 'https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip' -o $cplZip
          foreach ($z in @($ahkZip, $cplZip)) {
            if ((Get-Item $z).Length -lt 100KB) { Write-Error "::error::$z 下载不完整"; exit 1 }
          }
          Expand-Archive $ahkZip -DestinationPath $dir -Force
          Expand-Archive $cplZip -DestinationPath $dir -Force
          if (-not (Test-Path "$dir\Ahk2Exe.exe") -or -not (Test-Path "$dir\AutoHotkey64.exe")) {
            Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName
            Write-Error '::error::解压后未找到 Ahk2Exe.exe / AutoHotkey64.exe'
            exit 1
          }
          "AHK2EXE=$dir\Ahk2Exe.exe" >> $env:GITHUB_ENV
          "AHKBASE=$dir\AutoHotkey64.exe" >> $env:GITHUB_ENV
          "AHK v2 就绪: $dir"

      - name: 编译
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Join-Path (Get-Location) "dist\CursorTip_v$env:VERSION.exe"
          $p = Start-Process -FilePath $env:AHK2EXE -ArgumentList '/silent', 'verbose', '/in', 'CursorTip.ahk', '/out', $exe, '/base', $env:AHKBASE -Wait -PassThru
          "Ahk2Exe exit: $($p.ExitCode)"
          if (-not (Test-Path $exe)) {
            Write-Error '::error::编译失败，未产出 exe'
            exit 1
          }
          "编译产物: $exe ($((Get-Item $exe).Length) bytes)"

      - name: 打包 zip（exe + LICENSE）
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\CursorTip_v$env:VERSION.exe", 'LICENSE' -DestinationPath "dist\CursorTip_v$env:VERSION.zip" -Force
          "打包完成: dist\CursorTip_v$env:VERSION.zip"

      - name: 发布 GitHub Release（tag 由 VERSION 推导，指向本次构建 SHA）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag --target $env:GITHUB_SHA --title "CursorTip $tag" --generate-notes "dist\CursorTip_v$env:VERSION.exe" "dist\CursorTip_v$env:VERSION.zip"
          "已发布 Release $tag"
