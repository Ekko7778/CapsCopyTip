# CursorTip 发行构建：VERSION.ahk 变更时自动触发（paths 按整个 push 的 two-dot diff 判定，
# bump 混在多 commit push 里也不会漏），手动 Run workflow 作为逃逸通道
# 流程：bump VERSION.ahk → push main → build-release (windows, 编译 + Draft)
#   tag = vX.Y.Z 由 VERSION.ahk 推导（单一真源，CursorTip.ahk #Include 它，exe 内版本同源），
#   --target 钉死在本次构建的 SHA，不存在 tag/版本号错位的可能
# Draft 模式下生成的 Release 需 AI 后续编辑（artifact 下载草稿 → 填充本次更新段 → gh release edit publish）。
# 注意：tag 已存在时 gh 会报错；想重发同版本需先删 Release + tag。
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION.ahk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # paths 过滤已保证只有 VERSION.ahk 变更的 push 才进得来，无需再 diff 守门
  build-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 读取版本号（单一真源：VERSION.ahk，CursorTip.ahk #Include 它）
        shell: pwsh
        run: |
          $m = Select-String -Path 'VERSION.ahk' -Pattern 'global VERSION := "(\d+\.\d+\.\d+)"'
          if (-not $m) {
            Write-Error '::error::VERSION.ahk 里找不到 VERSION 行'
            exit 1
          }
          $ver = $m.Matches[0].Groups[1].Value
          "VERSION=$ver" >> $env:GITHUB_ENV
          "脚本版本号: $ver"

      # AHK v2 zip 只含运行时（AutoHotkey64.exe）；Ahk2Exe 在 AutoHotkey/Ahk2Exe 仓库单独发行
      # （v2 安装器/zip 均不附带，靠 UX\install-ahk2exe.ahk 按需下载——在无桌面 CI 上不可用）。
      # 必须用 release 资产里的**编译版** Ahk2Exe.zip（单文件 Ahk2Exe.exe）；
      # tag 源码 zipball 不可用：只有 ~54KB 且为 v1.1 源码，v2 解释器无法运行。
      # 双 zip 直解到同一目录 = 社区通用 CI 配方，绕开一切安装器（官方/UX/choco 安装器均会挂起或装不上）。
      - name: 下载 AutoHotkey v2 + Ahk2Exe（zip 直解，不走安装器）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ahk'
          $ahkZip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          $cplZip = Join-Path $env:RUNNER_TEMP 'ahk2exe.zip'
          curl.exe -sL 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.27/AutoHotkey_2.0.27.zip' -o $ahkZip
          curl.exe -sL 'https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip' -o $cplZip
          foreach ($z in @($ahkZip, $cplZip)) {
            if ((Get-Item $z).Length -lt 100KB) { Write-Error "::error::$z 下载不完整"; exit 1 }
          }
          Expand-Archive $ahkZip -DestinationPath $dir -Force
          Expand-Archive $cplZip -DestinationPath $dir -Force
          if (-not (Test-Path "$dir\Ahk2Exe.exe") -or -not (Test-Path "$dir\AutoHotkey64.exe")) {
            Get-ChildItem $dir -Recurse | Select-Object -ExpandProperty FullName
            Write-Error '::error::解压后未找到 Ahk2Exe.exe / AutoHotkey64.exe'
            exit 1
          }
          "AHK2EXE=$dir\Ahk2Exe.exe" >> $env:GITHUB_ENV
          "AHKBASE=$dir\AutoHotkey64.exe" >> $env:GITHUB_ENV
          "AHK v2 就绪: $dir"

      - name: 编译
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Join-Path (Get-Location) "dist\CursorTip_v$env:VERSION.exe"
          $p = Start-Process -FilePath $env:AHK2EXE -ArgumentList '/silent', 'verbose', '/in', 'CursorTip.ahk', '/out', $exe, '/base', $env:AHKBASE -Wait -PassThru
          "Ahk2Exe exit: $($p.ExitCode)"
          if (-not (Test-Path $exe)) {
            Write-Error '::error::编译失败，未产出 exe'
            exit 1
          }
          "编译产物: $exe ($((Get-Item $exe).Length) bytes)"

      - name: 打包 zip（exe + LICENSE）
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\CursorTip_v$env:VERSION.exe", 'LICENSE' -DestinationPath "dist\CursorTip_v$env:VERSION.zip" -Force
          "打包完成: dist\CursorTip_v$env:VERSION.zip"

      # Release body 草稿：固定模板（下载与使用 + 拦截提示）+ AI 填充位（本次更新）
      # AI 流程：Actions run 页面下载 release-draft artifact → 填充 AI-FILL 段 → gh release edit publish
      - name: 生成 Release body 草稿
        shell: pwsh
        run: |
          $draft = @"
          # CursorTip v$env:VERSION

          ## 本次更新

          <!-- AI-FILL-START -->
          <!-- AI-FILL-END -->

          ## 下载与使用

          下载 `CursorTip_v$env:VERSION.zip`，解压到固定目录，双击 `CursorTip.exe` 运行。

          > 首次可能被 SmartScreen 拦截，点「更多信息 → 仍要运行」即可（本项目未做代码签名）。
          "@
          Set-Content -Path 'dist\RELEASE_DRAFT.md' -Value $draft -Encoding UTF8
          "草稿已生成: dist\RELEASE_DRAFT.md"

      - name: 上传草稿为 workflow artifact（AI 下载源）
        uses: actions/upload-artifact@v4
        with:
          name: release-draft
          path: dist\RELEASE_DRAFT.md

      - name: 创建 Draft Release（tag 由 VERSION 推导，指向本次构建 SHA）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          gh release create $tag --target $env:GITHUB_SHA --title "CursorTip $tag" --draft --notes-file 'dist\RELEASE_DRAFT.md' "dist\CursorTip_v$env:VERSION.exe" "dist\CursorTip_v$env:VERSION.zip"
          "已创建 Draft Release $tag（待 AI 编辑 → publish，发布后触发 mirror-to-r2）"
