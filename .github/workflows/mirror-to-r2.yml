name: Mirror release assets to R2

# 把每个 release 的资源同步到 Cloudflare R2 桶 `space`，
# 让 zeno528/CursorTip-Website 站能优先从 R2 下载（兜底 GitHub 直链）。
#
# 触发：
#   - release: published（开发者发布正式 release 时自动跑）
#   - workflow_dispatch（手动补传旧版本时用）
#
# 桶内布局：
#   cursortip/{tag}/{assetName}                  — 资源本体
#   cursortip/manifest.json                      - 已镜像版本清单（被网站读取）
#
# 所需 secrets（仓库 Settings → Secrets and variables → Actions）：
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要补传的 tag（workflow_dispatch 模式必填，如 v1.0.1）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            INPUT_TAG="${{ inputs.tag }}"
            if [ -z "$INPUT_TAG" ]; then
              echo "::error::workflow_dispatch 模式需要指定 inputs.tag"
              exit 1
            fi
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Install AWS CLI
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/
          sudo /tmp/aws/install --update
          rm -rf /tmp/aws /tmp/awscliv2.zip

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          mkdir -p /tmp/assets
          gh release download "$TAG" --dir /tmp/assets --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload assets to R2 (同 tag 自动覆盖)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://ee5123663792160a81b4940b1e6a612c.r2.cloudflarestorage.com
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          shopt -s nullglob
          for f in /tmp/assets/*; do
            name="$(basename "$f")"
            echo "→ cursortip/${TAG}/${name}"
            aws s3 cp "$f" "s3://space/cursortip/${TAG}/${name}" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/zip" \
              --only-show-errors
          done

      - name: Update R2 manifest (幂等：同 tag 整组替换)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://ee5123663792160a81b4940b1e6a612c.r2.cloudflarestorage.com
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # 1) 拉取已有 manifest（首次/被删 → 404，按空对象处理）
          aws s3 cp "s3://space/cursortip/manifest.json" /tmp/manifest.json \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors 2>/dev/null \
            || echo '{}' > /tmp/manifest.json

          # 2) 列出本次新上传的 assets 名称（写文件后给 Python 读，避免 heredoc 嵌套坑）
          ( ls /tmp/assets | sort | grep -v '^$' ) > /tmp/assets.list

          # 3) Python 合并：同 tag 整组替换（不追加），更新 updated_at
          TAG="$TAG" python3 - <<'PY'
          import json, datetime, os, pathlib
          tag = os.environ["TAG"]
          manifest_path = pathlib.Path("/tmp/manifest.json")
          try:
              m = json.loads(manifest_path.read_text() or "{}")
          except json.JSONDecodeError:
              m = {}
          m.setdefault("updated_at", "")
          m.setdefault("mirrored", {})
          assets = [line.strip() for line in pathlib.Path("/tmp/assets.list").read_text().splitlines() if line.strip()]
          m["mirrored"][tag] = assets
          m["updated_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          manifest_path.write_text(json.dumps(m, indent=2, ensure_ascii=False) + "\n")
          PY

          # 4) 把合并后的 manifest 推回 R2（缓存策略 no-cache → 网站 fetch 能拿到最新）
          aws s3 cp /tmp/manifest.json "s3://space/cursortip/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --only-show-errors

          echo "✓ manifest 已更新"
          cat /tmp/manifest.json